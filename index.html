<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Матча Бар Sheeps</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #5B7B58; /* Зеленый фон */
            height: 100vh;
            overflow: hidden; /* Прячем всё, что выходит за края */
            position: relative;
        }

        .sheep {
            position: absolute;
            width: 150px;
            top: 50%; /* Овечка будет ровно посередине экрана по высоте */
            
            /* Анимация движения */
            animation: run 8s linear infinite;
        }

        @keyframes run {
            0% { left: -150px; }
            100% { left: 100%; }
        }
    </style>
</head>
<body>

    <!-- Вставляем картинку овечки -->
    <img src="https://cdn-icons-png.flaticon.com/512/616/616408.png" class="sheep" alt="Овечка">

</body>
</html>
